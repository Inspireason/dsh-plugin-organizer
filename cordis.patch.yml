# dsh-plugin-organizer bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile web add <user>/dsh-plugin-organizer
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends the package to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line. No profile file edits
# needed — one command installs and mounts.
#
# If the profile still carries a manual mount row for this plugin in its own
# cordis.patch.yml, remove it before switching to the bundle channel to
# avoid double-mounting (two entries, two plugin tabs).
- insert:
    - id: plugin-organizer
      name: 'dsh-plugin-organizer'
